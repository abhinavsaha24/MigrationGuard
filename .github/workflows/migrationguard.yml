name: MigrationGuard Verification

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

# Minimal permissions — read-only by default, write only for step summary
permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: migrationguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
      DATABASE_URL: postgresql://postgres:password@localhost:5432/migrationguard_test?schema=public
      INITIAL_ADMIN_PASSWORD: admin123!
      INITIAL_REVIEWER_PASSWORD: reviewer123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Setup Database
        run: |
          npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
          npx prisma db push --schema apps/server/prisma/schema.prisma --skip-generate
          npx tsx apps/server/src/seed.ts

      - name: Unit & Integration Tests
        run: npm run test

      - name: Run MigrationGuard Verification
        id: verify
        # Verifier CLI contract:
        #   exit 0 = verified PASS — migration is compatible
        #   exit 1 = verified FAIL — migration detected as incompatible
        #   exit 2 = configuration error
        #   exit 3 = infrastructure failure
        #   exit 4 = unexpected error / crash
        #
        # For the M1 regression fixture (destructive rename), the verifier is
        # expected to detect the incompatibility (exit 1).
        # We capture the exit code and execute explicit CI assertions:
        # - Verifier must exit with code 1 specifically.
        # - Matrix must report OLD+V1: PASS, NEW+V1: FAIL, OLD+V2: FAIL, NEW+V2: PASS.
        # - Fault category must strictly be DESTRUCTIVE_RENAME with CONFIRMED confidence.
        # - Evidence must contain expected missing column failure detail.
        # - Any unexpected crash, missing matrix state, or divergence fails the CI step.
        run: |
          set +e
          npm run verify > output.txt 2>&1
          exit_code=$?
          set -e
          cat output.txt
          node scripts/ci-assert-verify.js "$exit_code" output.txt

      - name: Install Benchmark Dependencies
        run: |
          for dir in benchmark/fixtures/* benchmark/repositories/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing in $dir..."
              (cd "$dir" && npm install --no-audit --no-fund)
            fi
          done

      - name: Run Benchmark
        run: |
          npm run benchmark > benchmark_output.txt 2>&1
          cat benchmark_output.txt
          echo "# MigrationGuard Benchmark" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "Benchmark Results" benchmark_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Archive Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrationguard-reports
          path: |
            reports/
            docs/benchmark/RESULTS.md
          retention-days: 30
